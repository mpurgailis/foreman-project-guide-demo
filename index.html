<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Independent Foreman Locker Systems conversational project guide demo."/>
<title>Foreman Project Guide - Chat Demo</title>
<style>
:root{--ink:#14231d;--muted:#68746f;--paper:#f3f2ec;--card:#fff;--line:#dde3df;--green:#173f32;--green2:#245945;--lime:#d9ed78;--soft:#edf3ef;--warm:#fff4d9;--shadow:0 22px 60px rgba(26,43,36,.10)}*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(20,35,29,.10);background:rgba(243,242,236,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:830;letter-spacing:-.025em}.mark{width:34px;height:34px;display:grid;place-items:center;color:white;background:var(--green);border-radius:10px;font-size:13px}.brand em{font-style:normal;color:#849089;font-weight:520}.tag{font-size:11px;color:#5b6963;background:white;border:1px solid var(--line);padding:7px 11px;border-radius:99px}.layout{width:min(820px,calc(100% - 32px));margin:28px auto 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-height:760px}.intro{align-self:start;position:sticky;top:95px;padding:22px}.eyebrow{font-size:11px;font-weight:780;text-transform:uppercase;letter-spacing:.13em;color:#6c7973}.intro h1{font-size:32px;line-height:1.03;letter-spacing:-.048em;margin:15px 0 12px}.intro p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}.points{margin-top:24px;display:grid;gap:13px}.point{display:grid;grid-template-columns:27px 1fr;gap:10px;align-items:start;font-size:12px;line-height:1.4;color:#56645e}.point i{width:25px;height:25px;border-radius:8px;background:white;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--green)}.privacy{margin-top:22px;padding:13px;border-radius:13px;background:#e9eee9;color:#59665f;font-size:11px;line-height:1.45}.chat{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}.chatHead{height:70px;padding:0 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.agent{display:flex;gap:11px;align-items:center}.orb{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#10271e}.agent strong{display:block;font-size:13px}.agent span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}.dot{width:6px;height:6px;background:#57a778;border-radius:50%}.restart{border:0;background:transparent;color:#66726d;font-size:12px;cursor:pointer;padding:8px}.thread{height:610px;overflow-y:auto;padding:28px 26px 18px;scroll-behavior:smooth}.message{display:flex;gap:10px;max-width:690px;margin:0 0 19px;animation:rise .22s ease}.message.user{margin-left:auto;justify-content:flex-end}.avatar{width:28px;height:28px;border-radius:9px;flex:0 0 auto;background:var(--green);color:white;display:grid;place-items:center;font-size:10px;font-weight:850;margin-top:2px}.bubble{padding:13px 15px;border-radius:7px 17px 17px 17px;background:var(--soft);font-size:14px;line-height:1.5;white-space:pre-line}.user .bubble{background:var(--green);color:white;border-radius:17px 7px 17px 17px;max-width:520px}.bubble small{display:block;color:#718078;margin-top:7px;font-size:11px}.thinking{display:flex;align-items:center;gap:10px;color:#68766f;font-size:12px}.miniOrb{width:30px;height:30px;border-radius:10px;background:#10271e;display:grid;place-items:center}.result{border:1px solid #cfd9d3;background:white;border-radius:18px;padding:18px;margin-top:11px;box-shadow:0 10px 24px rgba(22,51,40,.06)}.resultTop{display:flex;justify-content:space-between;gap:12px;align-items:start}.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#738078;font-weight:780}.result h3{font-size:22px;letter-spacing:-.035em;margin:8px 0 6px}.result p{font-size:12px;color:#68766f;line-height:1.5;margin:0}.fit{font-size:10px;font-weight:820;background:var(--lime);padding:6px 8px;border-radius:99px;white-space:nowrap}.summary{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px}.sum{font-size:11px;color:#748079}.sum b{display:block;color:#273c33;font-size:12px;margin-top:2px}.route{margin-top:13px;padding:11px 12px;background:var(--soft);border-radius:11px;font-size:11px;color:#52625a;line-height:1.45}.route strong{color:var(--green)}.composer{border-top:1px solid var(--line);padding:15px 19px 18px;background:#fbfcfb}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.suggest{border:1px solid #cfd9d3;background:white;color:#29483b;border-radius:99px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s}.suggest:hover{border-color:var(--green);background:#f3f7f4;transform:translateY(-1px)}.suggest:disabled{opacity:.45;cursor:default}.inputrow{display:grid;grid-template-columns:1fr auto;gap:9px}.inputrow input{border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;background:white}.inputrow input:focus{border-color:#7d9c8f;box-shadow:0 0 0 3px rgba(29,75,59,.09)}.send{width:46px;border:0;border-radius:13px;background:var(--green);color:white;cursor:pointer;font-size:17px}.send:disabled{opacity:.35;cursor:default}.hint{font-size:10px;color:#8a948f;margin-top:8px}.completeActions{display:flex;gap:8px}.action{border:0;border-radius:12px;padding:11px 14px;background:var(--green);color:white;font-size:12px;font-weight:720;cursor:pointer}.action.secondary{background:white;color:var(--green);border:1px solid var(--line)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:800px){.layout{grid-template-columns:1fr;width:min(680px,calc(100% - 20px));margin:14px auto 24px}.intro{position:static;padding:12px 9px}.intro h1{font-size:25px;margin:10px 0 7px}.intro p{font-size:12px}.points,.privacy{display:none}.chat{min-height:calc(100vh - 190px)}.thread{height:calc(100vh - 355px);min-height:430px}.tag{display:none}}@media(max-width:480px){.top{height:59px;padding:0 15px}.layout{width:100%;margin:0;display:block}.intro{padding:14px 17px;border-bottom:1px solid var(--line)}.intro h1{font-size:20px;margin:0}.intro .eyebrow,.intro p{display:none}.chat{border:0;border-radius:0;box-shadow:none;min-height:calc(100vh - 106px)}.chatHead{height:61px;padding:0 14px}.thread{height:calc(100vh - 282px);min-height:370px;padding:20px 14px 12px}.message{margin-bottom:16px}.bubble{font-size:13px;padding:11px 13px}.composer{padding:12px 12px 14px}.suggestions{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;margin-right:-12px}.suggest{white-space:nowrap}.summary{grid-template-columns:1fr}.resultTop{display:block}.fit{display:inline-block;margin-top:9px}.brand em{display:none}}
</style></head>
<body><div id="root"></div>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime"}}</script>
<script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{VoiceBeam}from'https://esm.sh/voice-beam@0.1.0?external=react';
const qs=[
 {key:'project',text:'What kind of space are the lockers for?',replies:['Fitness or wellness','Workplace or education','Hospitality or residential','Industrial or public safety']},
 {key:'environment',text:a=>a.project==='Fitness or wellness'?'Got it. Will these lockers be near showers, a pool, or another humid area?':'What will the lockers be exposed to?',replies:['Dry indoor','Wet or humid','Outdoor weather','Heavy-duty use']},
 {key:'quantity',text:'Roughly how many locker openings do you need? A range is fine.',replies:['1–4','5–14','15–49','50–100+']},
 {key:'stage',text:a=>(a.quantity==='1–4'||a.quantity==='5–14')?'Is this a standalone request, or could it be part of a larger room or rollout?':'How far along is the project?',replies:a=>(a.quantity==='1–4'||a.quantity==='5–14')?['Standalone request','Could grow to 15+','Part of a larger project']:['Exploring options','Budgeting','Plans in progress','Ready to quote']},
 {key:'timing',text:'When do you need the lockers on site?',replies:['Within 3 months','3–6 months','6–12 months','More than 12 months']}
];
let answers={},step=0,done=false;
function fit(a){const small=(a.quantity==='1–4'||a.quantity==='5–14')&&!['Could grow to 15+','Part of a larger project'].includes(a.stage);if(small)return{small:true,name:'Commercial project check',status:'Set expectations first',desc:'This scope may be below Foreman’s normal custom-project fit. Confirm realistic commercial pricing before using sales time.'};if(['Wet or humid','Outdoor weather'].includes(a.environment))return{name:'Signature Phenolic',status:'Strong starting fit',desc:'Waterproof, durable phenolic is the best starting point for humid, wet, or exposed locations.'};if(a.environment==='Heavy-duty use'||a.project==='Industrial or public safety')return{name:'Traditional Phenolic or Hybrid',status:'Strong starting fit',desc:'Durable commercial construction is the right place to start, with doors, hardware, and ventilation confirmed by sales.'};return{name:'Plastic Laminate or Hybrid',status:'Good starting fit',desc:'A practical commercial starting point for dry indoor spaces. Sales can narrow finish, hardware, and layout.'}}
const root=document.getElementById('root');root.innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="mark">F</div><span>FOREMAN <em>Project Guide</em></span></div><div class="tag">Interactive concept · chat prototype</div></header><main class="layout"><section class="chat"><header class="chatHead"><div class="agent"><div class="orb"><b style="color:white">F</b></div><div><strong>Foreman project assistant</strong><span><i class="dot"></i><span id="status">Online · replies instantly</span></span></div></div><button class="restart" id="restart">Start over</button></header><div class="thread" id="thread"></div><div class="composer" id="composer"><div id="suggestions" class="suggestions"></div><div id="beam"></div><form class="inputrow" id="form"><input id="input" placeholder="Or type your answer…" aria-label="Type your answer"><button class="send" title="Send">↑</button></form><div class="hint">Demo only - no answers are saved or submitted.</div></div></section></main></div>`;
createRoot(document.getElementById('beam')).render(React.createElement(VoiceBeam,{type:'default',theme:'light',colorVariant:'forest',strength:.65},React.createElement('div',{style:{height:2,width:'100%',borderRadius:10}})));
const thread=document.getElementById('thread'),suggestions=document.getElementById('suggestions'),input=document.getElementById('input');
function msg(role,text){const el=document.createElement('div');el.className='message '+(role==='user'?'user':'');el.innerHTML=(role==='assistant'?'<div class="avatar">F</div>':'')+'<div class="bubble"></div>';el.querySelector('.bubble').textContent=text;thread.append(el);thread.scrollTop=thread.scrollHeight}
function renderReplies(){suggestions.innerHTML='';if(done)return;const q=qs[step],arr=typeof q.replies==='function'?q.replies(answers):q.replies;arr.forEach(x=>{const b=document.createElement('button');b.className='suggest';b.textContent=x;b.onclick=()=>answer(x);suggestions.append(b)})}
function result(){const d=fit(answers),el=document.createElement('div');el.className='message';const rows=Object.entries({Space:answers.project,Environment:answers.environment,Quantity:answers.quantity,Stage:answers.stage,Timing:answers.timing}).map(([k,v])=>`<div class="sum">${k}<b>${v}</b></div>`).join('');el.innerHTML=`<div class="avatar">F</div><div class="bubble" style="padding:0;background:transparent;width:100%"><div class="result"><div class="resultTop"><div><div class="label">${d.small?'Project-size guidance':'Recommended starting point'}</div><h3>${d.name}</h3><p>${d.desc}</p></div><span class="fit">${d.status}</span></div><div class="summary">${rows}</div><div class="route"><strong>Route: ${d.small?'Set expectations. ':'Sales review. '}</strong>${d.small?'Show realistic commercial pricing and offer sales if the scope grows.':'Send this brief with the material fit, quantity, stage, timeline, and any plans.'}</div></div></div>`;thread.append(el);thread.scrollTop=thread.scrollHeight;document.getElementById('composer').innerHTML='<div class="completeActions"><button class="action" id="again">Restart demo</button></div>';document.getElementById('again').onclick=restart}
function answer(value){if(done||!value.trim())return;msg('user',value);answers[qs[step].key]=value.trim();document.getElementById('status').textContent='Reviewing your answer';suggestions.innerHTML='<span class="thinking">••• Thinking about the best next question…</span>';setTimeout(()=>{step++;document.getElementById('status').textContent='Online · replies instantly';if(step<qs.length){const t=qs[step].text;msg('assistant',typeof t==='function'?t(answers):t);renderReplies()}else{done=true;const d=fit(answers);msg('assistant',d.small?'Thanks. I’d set expectations before routing this to sales.':'Thanks - this looks worth a focused sales conversation. Here’s the starting point and the brief I’d pass along.');result()}},550)}
function restart(){location.reload()}document.getElementById('restart').onclick=restart;document.getElementById('form').onsubmit=e=>{e.preventDefault();answer(input.value);input.value=''};msg('assistant','Hi - I’m Foreman’s project guide. I can narrow the right locker family and prepare a useful brief for sales in about two minutes.');msg('assistant',qs[0].text);renderReplies();
</script></body></html>
