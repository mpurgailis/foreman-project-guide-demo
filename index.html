<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Independent Foreman Locker Systems conversational project guide demo."/>
<title>Foreman Project Guide - Libraries.dev AgentChat adaptation</title>
<style>
:root{--page:#f3f2ec;--panel:#fff;--text:#14231d;--text-muted:#68746f;--green:#173f32;--line:#dde3df;--soft:#edf3ef;--cmp-bg:#f8faf8;--cmp-border:#ccd6d0;--cmp-text:#29483b;--cmp-text-busy:#8b9690}*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}.app{min-height:100vh}.top{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(20,35,29,.1)}.brand{font-size:14px;font-weight:800;letter-spacing:-.02em}.brand span{font-weight:500;color:var(--text-muted)}.source{font-size:11px;color:var(--text-muted)}.source a{color:inherit}.shell{width:min(760px,calc(100% - 28px));margin:28px auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 55px rgba(26,43,36,.09);overflow:hidden}.panel-head{height:64px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head strong{display:block;font-size:13px}.panel-head span{font-size:11px;color:var(--text-muted)}.restart{border:0;background:transparent;color:var(--text-muted);cursor:pointer;font-size:12px}
/* Direct adaptation of Libraries.dev AgentChat CSS at commit 44fef854. */
.st-chat{display:flex;flex-direction:column;gap:12px;min-height:650px}.st-chat-log{position:relative;flex:1;min-height:0;overflow-y:auto;padding:30px 25px 12px;scrollbar-width:thin;mask-image:linear-gradient(to bottom,transparent 0,#000 0, #000 calc(100% - var(--fade-bottom,0px)),transparent 100%)}.st-chat-empty{color:var(--text-muted);font-size:13px;line-height:1.5;margin:auto;max-width:390px;text-align:center}.st-chat-msg{width:fit-content;max-width:min(82%,590px);padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.48;white-space:pre-line;margin:0 0 14px;background:var(--soft)}.st-chat-msg[data-role="user"]{margin-left:auto;background:var(--green);color:white;border-bottom-right-radius:5px}.st-chat-msg[data-role="agent"]{padding-left:0;padding-right:0;color:var(--text);background:transparent;max-width:620px}.st-chat-msg[data-role="applied"]{font-size:12px;color:#3f6555;background:#eaf3ed;border:1px solid #d1e1d8}.st-chat-msg[data-role="error"]{color:#9d3131;background:#fff0f0}.st-chat-thinking{display:flex;align-items:center;gap:9px;color:var(--text-muted);font-size:12px;margin:3px 0 14px}.st-think-orb{width:20px;height:20px;display:inline-grid;place-items:center}.st-chat-composer{position:relative;display:flex;align-items:flex-end;gap:8px;margin:0 18px 18px;padding:10px 10px 10px 14px;border:1px solid var(--cmp-border);border-radius:18px;background:var(--cmp-bg);box-shadow:0 1px 2px rgba(20,35,29,.04);transition:border-color .15s,box-shadow .15s}.st-chat-composer:hover,.st-chat-composer:focus-within{border-color:#93a79d;box-shadow:0 0 0 3px rgba(23,63,50,.07)}.st-chat-composer[data-busy]{opacity:.8}.st-chat-input{flex:1;min-width:0;max-height:130px;resize:none;overflow-y:auto;border:0;background:transparent;color:var(--cmp-text);font:inherit;font-size:14px;line-height:20px;padding:5px 0;outline:none}.st-chat-input::placeholder{color:#87938d}.st-chat-send{width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;cursor:pointer}.st-chat-send:disabled{opacity:.26;cursor:default}.st-chat-send svg{width:16px;height:16px}.st-suggestions{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px}.st-suggestion{border:1px solid #cfdbd4;background:white;color:#29483b;border-radius:99px;padding:8px 11px;font-size:12px;cursor:pointer}.st-suggestion:hover{border-color:#769385;background:#f4f8f5}.result{border:1px solid #cfdbd4;border-radius:16px;padding:16px;background:#fff;box-shadow:0 8px 22px rgba(22,51,40,.05)}.result .label{text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:#718078;font-weight:750}.result h3{font-size:21px;letter-spacing:-.03em;margin:7px 0}.result p{margin:0;color:var(--text-muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.sum{font-size:10px;color:#7a8680}.sum b{display:block;color:#294038;font-size:12px;margin-top:2px}.route{font-size:11px;line-height:1.45;background:var(--soft);padding:10px 11px;border-radius:10px;margin-top:12px}.route strong{color:var(--green)}.foot{font-size:10px;color:#8a948f;padding:0 18px 13px}.hidden{display:none}@media(max-width:600px){.top{height:57px;padding:0 14px}.source{display:none}.shell{width:100%;margin:0}.panel{border:0;border-radius:0;box-shadow:none}.st-chat{height:calc(100vh - 57px);min-height:560px}.st-chat-log{padding:22px 14px 8px}.st-chat-composer{margin:0 12px 12px}.st-suggestions{flex-wrap:nowrap;overflow-x:auto;padding:0 12px}.st-suggestion{white-space:nowrap}.summary{grid-template-columns:1fr}.st-chat-msg{max-width:88%;font-size:13px}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import React,{useCallback,useEffect,useLayoutEffect,useRef,useState}from'https://esm.sh/react@18.2.0';
import{createRoot}from'https://esm.sh/react-dom@18.2.0/client';
import{ThinkingOrb}from'https://esm.sh/thinking-orbs@0.3.1?external=react';
const e=React.createElement;
const STEPS=[
 {key:'project',q:'What kind of space are the lockers for?',options:['Fitness / wellness','Workplace / education','Industrial / public safety']},
 {key:'environment',q:'What conditions will the lockers face?',options:['Dry indoor','Wet / humid','Heavy-duty / outdoor']},
 {key:'quantity',q:'Roughly how many openings do you need?',options:['1-4','5-14','15-49','50-100+']},
 {key:'stage',q:'How far along is the project?',options:['Early research','Plans in progress','Ready to quote']},
 {key:'timing',q:'When do you expect to purchase?',options:['Within 3 months','3-6 months','6-12 months','More than a year']}
];
function fit(a){const small=['1-4','5-14'].includes(a.quantity);if(small)return{name:'Commercial project check',desc:'Foreman is built around commercial programs. Check minimums and realistic pricing before routing sales time.',small:true};if(a.environment==='Wet / humid')return{name:'Signature Phenolic',desc:'A strong starting point for humid, wet and high-use environments.',small:false};if(a.environment==='Heavy-duty / outdoor'||a.project==='Industrial / public safety')return{name:'Traditional Phenolic or Hybrid',desc:'Start with durable material systems suited to heavy use and tougher conditions.',small:false};return{name:'Plastic Laminate or Hybrid',desc:'A practical starting point for dry indoor projects, subject to plans and finish requirements.',small:false}}
function Result({answers}){const d=fit(answers);return e('div',{className:'result'},e('div',{className:'label'},d.small?'Project-size guidance':'Recommended starting point'),e('h3',null,d.name),e('p',null,d.desc),e('div',{className:'summary'},...Object.entries({Space:answers.project,Environment:answers.environment,Quantity:answers.quantity,Stage:answers.stage,Timing:answers.timing}).map(([k,v])=>e('div',{className:'sum',key:k},k,e('b',null,v)))),e('div',{className:'route'},e('strong',null,d.small?'Route: set expectations. ':'Route: sales review. '),d.small?'Offer sales if the scope grows or belongs to a larger program.':'Send the answers, product fit, plans and timeline to sales.'))}
function ThinkingStatus(){return e('div',{className:'st-chat-thinking',role:'status'},e('span',{className:'st-think-orb'},e(ThinkingOrb,{state:'working',size:20,theme:'light'})),e('span',null,'Checking the project details'))}
function AgentChat(){
 const[messages,setMessages]=useState([]),[step,setStep]=useState(0),[draft,setDraft]=useState(''),[busy,setBusy]=useState(false),[answers,setAnswers]=useState({});
 const logRef=useRef(null),inputRef=useRef(null),timer=useRef(),complete=step>=STEPS.length;
 const autosize=useCallback(()=>{const x=inputRef.current;if(x){x.style.height='auto';x.style.height=Math.min(x.scrollHeight||20,130)+'px'}},[]);
 useLayoutEffect(autosize,[draft,autosize]);
 useLayoutEffect(()=>{const x=logRef.current;if(x)x.scrollTop=x.scrollHeight},[messages,busy]);
 useEffect(()=>{setMessages([{role:'agent',text:'I’ll narrow the right locker direction and tell you whether the project is ready for a sales review.'},{role:'agent',text:STEPS[0].q}]);return()=>clearTimeout(timer.current)},[]);
 const answer=useCallback((raw)=>{const text=raw.trim();if(!text||busy||complete)return;const s=STEPS[step],next={...answers,[s.key]:text};setDraft('');setAnswers(next);setMessages(m=>[...m,{role:'user',text}]);setBusy(true);timer.current=setTimeout(()=>{setBusy(false);if(step+1<STEPS.length){setStep(step+1);setMessages(m=>[...m,{role:'agent',text:STEPS[step+1].q}])}else{setStep(STEPS.length);setMessages(m=>[...m,{role:'agent',result:next}])}},430)},[answers,busy,complete,step]);
 const restart=()=>{clearTimeout(timer.current);setAnswers({});setStep(0);setDraft('');setBusy(false);setMessages([{role:'agent',text:'I’ll narrow the right locker direction and tell you whether the project is ready for a sales review.'},{role:'agent',text:STEPS[0].q}])};
 const options=complete?[]:STEPS[step].options;
 const head=e('div',{className:'panel-head'},e('div',null,e('strong',null,'Foreman project assistant'),e('span',null,'Project qualification concept')),e('button',{className:'restart',onClick:restart},'Start over'));
 const log=e('div',{className:'st-chat-log',ref:logRef,role:'log','aria-label':'Agent conversation'},...messages.map((m,i)=>e('div',{className:'st-chat-msg','data-role':m.role,key:i},m.result?e(Result,{answers:m.result}):m.text)),busy?e(ThinkingStatus):null);
 const suggestions=complete?null:e('div',{className:'st-suggestions'},...options.map(o=>e('button',{className:'st-suggestion',key:o,onClick:()=>answer(o),disabled:busy},o)));
 const composer=complete?null:e('div',{className:'st-chat-composer','data-busy':busy?'':undefined},e('textarea',{ref:inputRef,className:'st-chat-input',value:draft,onChange:x=>setDraft(x.target.value),onKeyDown:x=>{if(x.key==='Enter'&&!x.shiftKey){x.preventDefault();answer(draft)}},rows:1,placeholder:'Type another answer…','aria-label':'Answer the assistant'}),e('button',{className:'st-chat-send',onClick:()=>answer(draft),disabled:!draft.trim()||busy,'aria-label':'Send message'},e('svg',{viewBox:'0 0 16 16',fill:'none',stroke:'currentColor',strokeWidth:'1.5',strokeLinecap:'round',strokeLinejoin:'round'},e('path',{d:'M8 12.67V3.33M12.67 8 8 3.33 3.33 8'}))));
 return e(React.Fragment,null,head,e('div',{className:'st-chat'},log,suggestions,composer,e('div',{className:'foot'},'Demo only - no answers are saved or submitted.')))
}
function App(){return e('div',{className:'app'},e('header',{className:'top'},e('div',{className:'brand'},'FOREMAN ',e('span',null,'Project Guide')),e('div',{className:'source'},'AgentChat adapted from ',e('a',{href:'https://github.com/Jakubantalik/Libraries.dev/blob/44fef854b811c14b84ec670c8496436615a0c448/sites/home/src/studio/controls.tsx'},'Libraries.dev source'))),e('main',{className:'shell'},e('section',{className:'panel'},e(AgentChat))))}createRoot(document.getElementById('root')).render(e(App));
</script></body></html>
